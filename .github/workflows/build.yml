name: Build upstream ONNX Runtime for Intel macOS
on:
  workflow_dispatch:
    inputs:
      arm_nchwc:
        type: boolean
        description: Build the native ARM64 NCHWc verification candidate instead of Intel
        default: false
        required: false
      arm_reduction8:
        type: boolean
        description: Apply the generic eight-channel reduction verification patch on ARM64
        default: false
        required: false
      arm_layernorm:
        type: boolean
        description: Combine reduction8 with a generic eight-lane normalization-order candidate
        default: false
        required: false
      arm_layernorm16:
        type: boolean
        description: Extend the generic normalization candidate to original FP16 inputs/outputs
        default: false
        required: false
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false && !inputs.arm_nchwc && !inputs.arm_reduction8 && !inputs.arm_layernorm && !inputs.arm_layernorm16
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Fetch and verify public upstream source
        run: |
          git clone --branch v1.31.0 --depth 1 --recursive --shallow-submodules https://github.com/microsoft/onnxruntime.git onnxruntime
          test "$(git -C onnxruntime rev-parse HEAD)" = 402979ac1bef89dcd55add41eaa7277c407599eb
      - name: Install build tools
        run: python -m pip install 'numpy==2.5.4' packaging setuptools 'wheel==0.48.0' 'cmake>=3.28' ninja
      - name: Build upstream wheel
        working-directory: onnxruntime
        run: >-
          ./build.sh --config Release --build_wheel --parallel 2 --skip_tests
          --compile_no_warning_as_error --cmake_extra_defines
          CMAKE_OSX_ARCHITECTURES=x86_64 CMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Verify architecture and apply Intel-only wheel tag
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$GITHUB_WORKSPACE/onnxruntime/build" -path '*/dist/onnxruntime-1.31.0-*.whl' -print)
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l | tr -d ' ')" = 1
          python -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); n=[x for x in z.namelist() if x.endswith(".so") and "onnxruntime_pybind11_state" in x]; assert len(n)==1; open(sys.argv[2],"wb").write(z.read(n[0]))' "$wheel" "$RUNNER_TEMP/onnxruntime-state.so"
          lipo "$RUNNER_TEMP/onnxruntime-state.so" -verify_arch x86_64
          wheel_dir=$(dirname "$wheel")
          wheel_name=$(basename "$wheel")
          case "$wheel_name" in
            *macosx_14_0_x86_64.whl) tagged="$wheel_name" ;;
            *)
              (cd "$wheel_dir" && python -m wheel tags --platform-tag=macosx_14_0_x86_64 "$wheel_name" > "$RUNNER_TEMP/tagged-name.txt")
              tagged=$(tail -n 1 "$RUNNER_TEMP/tagged-name.txt")
              ;;
          esac
          case "$tagged" in *macosx_14_0_x86_64.whl) ;; *) exit 1 ;; esac
          mkdir output
          cp "$wheel_dir/$tagged" output/
          shasum -a 256 output/*.whl > output/SHA256SUMS.txt
          git -C onnxruntime rev-parse HEAD > output/UPSTREAM-COMMIT.txt
      - name: Save public wheel for one day
        uses: actions/upload-artifact@v4
        with:
          name: upstream-onnxruntime-1.31.0-macos-x86_64
          path: output/
          retention-days: 1
          if-no-files-found: error
      - name: Check Intel import
        run: |
          python -m pip install output/*.whl
          python -c 'import onnxruntime,platform; assert platform.machine()=="x86_64"; assert onnxruntime.__version__=="1.31.0"; assert "CPUExecutionProvider" in onnxruntime.get_available_providers(); print("Intel ONNX Runtime import passed")'
  arm_nchwc:
    if: github.event.repository.private == false && (inputs.arm_nchwc || inputs.arm_reduction8 || inputs.arm_layernorm || inputs.arm_layernorm16)
    runs-on: macos-15
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: Fetch and verify public upstream source
        run: |
          git clone --branch v1.31.0 --depth 1 --recursive --shallow-submodules https://github.com/microsoft/onnxruntime.git onnxruntime
          test "$(git -C onnxruntime rev-parse HEAD)" = 402979ac1bef89dcd55add41eaa7277c407599eb
      - name: Apply optional generic reduction-order verification patch
        if: inputs.arm_reduction8 || inputs.arm_layernorm || inputs.arm_layernorm16
        working-directory: onnxruntime
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          source = Path('onnxruntime/core/mlas/lib/sconv_nchwc_kernel_neon.cpp')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'e75ca19cfda9a55764328436b986c982c139c80f9e1ca20acf8b97b3c178cd3b'
          patch = '--- a/onnxruntime/core/mlas/lib/sconv_nchwc_kernel_neon.cpp\n+++ b/onnxruntime/core/mlas/lib/sconv_nchwc_kernel_neon.cpp\n@@ -20,6 +20,13 @@\n #include "sconv_nchwc_kernel_neon.h"\n \n constexpr size_t BlockSize = MLAS_PLATFORM::MLAS_NEON_NCHWC_BLOCK_SIZE;\n+#if defined(MLAS_ARM_NEON_REDUCTION8)\n+// Preserve the physical NCHWc16 layout while matching an eight-channel\n+// floating-point reduction order. The option is off unless requested explicitly.\n+constexpr size_t ReductionBlock = 8;\n+#else\n+constexpr size_t ReductionBlock = BlockSize;\n+#endif\n \n // Common implementation for NCHW and NCHWC convolution kernels\n template <bool IsNchwcFormat>\n@@ -92,6 +99,18 @@\n                 BiasVector3 = MlasLoadFloat32x4(&Bias[filterSetBlock * BlockSize + 12]);\n             }\n \n+            const size_t ReductionCount = IsNchwcFormat ? BlockSize / ReductionBlock : 1;\n+            for (size_t reduction_part = 0; reduction_part < ReductionCount; ++reduction_part) {\n+                if (reduction_part != 0) {\n+                    OldOutput0 = Accumulator0;\n+                    OldOutput1 = Accumulator1;\n+                    OldOutput2 = Accumulator2;\n+                    OldOutput3 = Accumulator3;\n+                    Accumulator0 = ZeroVector;\n+                    Accumulator1 = ZeroVector;\n+                    Accumulator2 = ZeroVector;\n+                    Accumulator3 = ZeroVector;\n+                }\n             for (size_t kernel_pos = 0; kernel_pos < KernelHeight * KernelWidth; kernel_pos++) {\n                 size_t kh = kernel_pos / KernelWidth;\n                 size_t kw = kernel_pos % KernelWidth;\n@@ -100,7 +119,8 @@\n                                           kh * DilatedInputWidthElements + kw * DilationWidthElements;\n \n                 if constexpr (IsNchwcFormat) {\n-                    for (size_t filterBlock = 0; filterBlock < BlockSize; filterBlock++) {\n+                    for (size_t filterBlock = reduction_part * ReductionBlock;\n+                         filterBlock < (reduction_part + 1) * ReductionBlock; filterBlock++) {\n                         const float* input_element = input_base + filterBlock;\n                         const float* input_row_start = InputBase + kh * DilatedInputWidthElements;\n                         const float* input_row_end = input_row_start + InputWidthElements;\n@@ -155,10 +175,11 @@\n                 }\n             }\n \n-            Accumulator0 = MlasAddFloat32x4(Accumulator0, MlasAndFloat32x4(OldOutput0, AccumulateMask));\n-            Accumulator1 = MlasAddFloat32x4(Accumulator1, MlasAndFloat32x4(OldOutput1, AccumulateMask));\n-            Accumulator2 = MlasAddFloat32x4(Accumulator2, MlasAndFloat32x4(OldOutput2, AccumulateMask));\n-            Accumulator3 = MlasAddFloat32x4(Accumulator3, MlasAndFloat32x4(OldOutput3, AccumulateMask));\n+            Accumulator0 = MlasAddFloat32x4(Accumulator0, reduction_part == 0 ? MlasAndFloat32x4(OldOutput0, AccumulateMask) : OldOutput0);\n+            Accumulator1 = MlasAddFloat32x4(Accumulator1, reduction_part == 0 ? MlasAndFloat32x4(OldOutput1, AccumulateMask) : OldOutput1);\n+            Accumulator2 = MlasAddFloat32x4(Accumulator2, reduction_part == 0 ? MlasAndFloat32x4(OldOutput2, AccumulateMask) : OldOutput2);\n+            Accumulator3 = MlasAddFloat32x4(Accumulator3, reduction_part == 0 ? MlasAndFloat32x4(OldOutput3, AccumulateMask) : OldOutput3);\n+            } // Bias and activation are applied after both reduction halves.\n \n             Accumulator0 = MlasAddFloat32x4(Accumulator0, MlasAndFloat32x4(BiasVector0, BiasMask));\n             Accumulator1 = MlasAddFloat32x4(Accumulator1, MlasAndFloat32x4(BiasVector1, BiasMask));\n@@ -264,7 +285,7 @@\n         unsigned KernelFlags\n     )\n {\n-#if defined(MLAS_TARGET_ARM64) && defined(MLAS_USE_ARM_NEON_NCHWC) && !defined(_WIN32)\n+#if defined(MLAS_TARGET_ARM64) && defined(MLAS_USE_ARM_NEON_NCHWC) && !defined(_WIN32) && !defined(MLAS_ARM_NEON_REDUCTION8)\n     MlasConvNchwcFloatKernelNeonAsm(\n         Input,\n         Filter,\n'
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'apply', '--check', '-'], input=patch.encode(), check=True)
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'apply', '-'], input=patch.encode(), check=True)
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '9052d33f0d36cc082300a57afbe0f065f5981dfe54766c586bfbefb1382865c9'
          PY
      - name: Apply optional generic normalization-order verification patch
        if: inputs.arm_layernorm && !inputs.arm_layernorm16
        working-directory: onnxruntime
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          source = Path('onnxruntime/core/mlas/lib/layernorm.cpp')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'ab1412dbf1db1c64bb80d066093a737c3fc2fed9b787f4c1f35cd1fce154a4c4'
          patch = '--- a/onnxruntime/core/mlas/lib/layernorm.cpp\n+++ b/onnxruntime/core/mlas/lib/layernorm.cpp\n@@ -16,6 +16,61 @@\n --*/\n \n #include "mlasi.h"\n+#include <cmath>\n+\n+#if defined(MLAS_TARGET_ARM64) && defined(MLAS_ARM_AVX2_LAYERNORM)\n+static void LayerNormEightLaneOrder(\n+    const float* Input, const float* Scale, const float* Bias, float* Output,\n+    float* MeanOut, float* InvStdDevOut, size_t n, float Epsilon, bool Simplified)\n+{\n+    double sums[4] = {};\n+    float squares[8] = {};\n+    float mean = 0.0f;\n+    size_t i = 0;\n+    if (!Simplified || MeanOut != nullptr) {\n+        for (; i + 4 <= n; i += 4) {\n+            for (size_t lane = 0; lane < 4; ++lane) {\n+                sums[lane] += static_cast<double>(Input[i + lane]);\n+            }\n+        }\n+        double total = (sums[0] + sums[2]) + (sums[1] + sums[3]);\n+        for (; i < n; ++i) total += static_cast<double>(Input[i]);\n+        mean = static_cast<float>(total / static_cast<double>(n));\n+    }\n+    i = 0;\n+    for (; i + 8 <= n; i += 8) {\n+        for (size_t lane = 0; lane < 8; ++lane) {\n+            float value = Simplified ? Input[i + lane] : Input[i + lane] - mean;\n+            squares[lane] = std::fma(value, value, squares[lane]);\n+        }\n+    }\n+    float total = ((squares[0] + squares[4]) + (squares[2] + squares[6])) +\n+                  ((squares[1] + squares[5]) + (squares[3] + squares[7]));\n+    for (; i < n; ++i) {\n+        float value = Simplified ? Input[i] : Input[i] - mean;\n+        total += value * value;\n+    }\n+    float inverse = 1.0f / std::sqrt(total / static_cast<float>(n) + Epsilon);\n+    i = 0;\n+    for (; i + 8 <= n; i += 8) {\n+        for (size_t lane = 0; lane < 8; ++lane) {\n+            const size_t at = i + lane;\n+            float value = Simplified ? Input[at] : Input[at] - mean;\n+            value = value * inverse;\n+            Output[at] = !Simplified && Bias != nullptr\n+                ? std::fma(value, Scale[at], Bias[at]) : value * Scale[at];\n+        }\n+    }\n+    for (; i < n; ++i) {\n+        float value = Simplified ? Input[i] : Input[i] - mean;\n+        value = value * inverse * Scale[i];\n+        Output[i] = !Simplified && Bias != nullptr ? value + Bias[i] : value;\n+    }\n+    if (MeanOut != nullptr) *MeanOut = mean;\n+    if (InvStdDevOut != nullptr) *InvStdDevOut = inverse;\n+}\n+\n+#endif\n \n bool\n     MLASCALL\n@@ -31,6 +86,13 @@\n         bool Simplified\n     )\n {\n+#if defined(MLAS_TARGET_ARM64) && defined(MLAS_ARM_AVX2_LAYERNORM)\n+    if (NormSize >= (Simplified ? 16u : 8u)) {\n+        LayerNormEightLaneOrder(Input, Scale, Bias, Output, MeanOut, InvStdDevOut,\n+                                NormSize, Epsilon, Simplified);\n+        return true;\n+    }\n+#endif\n     auto kernel = GetMlasPlatform().LayerNormF32Kernel;\n     if (kernel == nullptr) {\n         return false;\n'
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'apply', '--check', '-'], input=patch.encode(), check=True)
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'apply', '-'], input=patch.encode(), check=True)
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '357e98dc7c4b97f96b56d55e44ebdb063964d25f46cd75769e316932e669b24b'
          PY
      - name: Apply optional generic half normalization-order patch
        if: inputs.arm_layernorm16
        working-directory: onnxruntime
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          source = Path('onnxruntime/core/mlas/lib/layernorm.cpp')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'ab1412dbf1db1c64bb80d066093a737c3fc2fed9b787f4c1f35cd1fce154a4c4'
          patch = '--- a/onnxruntime/core/mlas/lib/layernorm.cpp\n+++ b/onnxruntime/core/mlas/lib/layernorm.cpp\n@@ -16,6 +16,74 @@\n --*/\n \n #include "mlasi.h"\n+#include <cmath>\n+#include <vector>\n+#include "mlas_float16.h"\n+\n+#if defined(MLAS_TARGET_ARM64) && defined(MLAS_ARM_AVX2_LAYERNORM)\n+static void LayerNormEightLaneOrder(\n+    const float* Input, const float* Scale, const float* Bias, float* Output,\n+    float* MeanOut, float* InvStdDevOut, size_t n, float Epsilon, bool Simplified)\n+{\n+    double sums[4] = {};\n+    float squares[8] = {};\n+    float mean = 0.0f;\n+    size_t i = 0;\n+    if (!Simplified || MeanOut != nullptr) {\n+        for (; i + 4 <= n; i += 4) {\n+            for (size_t lane = 0; lane < 4; ++lane) {\n+                sums[lane] += static_cast<double>(Input[i + lane]);\n+            }\n+        }\n+        double total = (sums[0] + sums[2]) + (sums[1] + sums[3]);\n+        for (; i < n; ++i) total += static_cast<double>(Input[i]);\n+        mean = static_cast<float>(total / static_cast<double>(n));\n+    }\n+    i = 0;\n+    for (; i + 8 <= n; i += 8) {\n+        for (size_t lane = 0; lane < 8; ++lane) {\n+            float value = Simplified ? Input[i + lane] : Input[i + lane] - mean;\n+            squares[lane] = std::fma(value, value, squares[lane]);\n+        }\n+    }\n+    float total = ((squares[0] + squares[4]) + (squares[2] + squares[6])) +\n+                  ((squares[1] + squares[5]) + (squares[3] + squares[7]));\n+    for (; i < n; ++i) {\n+        float value = Simplified ? Input[i] : Input[i] - mean;\n+        total += value * value;\n+    }\n+    float inverse = 1.0f / std::sqrt(total / static_cast<float>(n) + Epsilon);\n+    i = 0;\n+    for (; i + 8 <= n; i += 8) {\n+        for (size_t lane = 0; lane < 8; ++lane) {\n+            const size_t at = i + lane;\n+            float value = Simplified ? Input[at] : Input[at] - mean;\n+            value = value * inverse;\n+            Output[at] = !Simplified && Bias != nullptr\n+                ? std::fma(value, Scale[at], Bias[at]) : value * Scale[at];\n+        }\n+    }\n+    for (; i < n; ++i) {\n+        float value = Simplified ? Input[i] : Input[i] - mean;\n+        value = value * inverse * Scale[i];\n+        Output[i] = !Simplified && Bias != nullptr ? value + Bias[i] : value;\n+    }\n+    if (MeanOut != nullptr) *MeanOut = mean;\n+    if (InvStdDevOut != nullptr) *InvStdDevOut = inverse;\n+}\n+\n+static void LayerNormHalfEightLaneOrder(\n+    const uint16_t* Input, const float* Scale, const float* Bias, uint16_t* Output,\n+    float* MeanOut, float* InvStdDevOut, size_t n, float Epsilon, bool Simplified)\n+{\n+    std::vector<float> values(n);\n+    for (size_t i = 0; i < n; ++i) values[i] = MLAS_Half2Float(Input[i]);\n+    LayerNormEightLaneOrder(values.data(), Scale, Bias, values.data(),\n+                           MeanOut, InvStdDevOut, n, Epsilon, Simplified);\n+    for (size_t i = 0; i < n; ++i) Output[i] = MLAS_Float2Half(values[i]);\n+}\n+\n+#endif\n \n bool\n     MLASCALL\n@@ -31,6 +99,13 @@\n         bool Simplified\n     )\n {\n+#if defined(MLAS_TARGET_ARM64) && defined(MLAS_ARM_AVX2_LAYERNORM)\n+    if (NormSize >= (Simplified ? 16u : 8u)) {\n+        LayerNormEightLaneOrder(Input, Scale, Bias, Output, MeanOut, InvStdDevOut,\n+                                NormSize, Epsilon, Simplified);\n+        return true;\n+    }\n+#endif\n     auto kernel = GetMlasPlatform().LayerNormF32Kernel;\n     if (kernel == nullptr) {\n         return false;\n@@ -74,6 +149,13 @@\n         bool Simplified\n     )\n {\n+#if defined(MLAS_TARGET_ARM64) && defined(MLAS_ARM_AVX2_LAYERNORM)\n+    if (NormSize >= 16) {\n+        LayerNormHalfEightLaneOrder(Input, Scale, Bias, Output, MeanOut, InvStdDevOut,\n+                                    NormSize, Epsilon, Simplified);\n+        return true;\n+    }\n+#endif\n     auto kernel = GetMlasPlatform().LayerNormF16Kernel;\n     if (kernel == nullptr || NormSize < 16) {\n         return false;\n'
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'apply', '--check', '-'], input=patch.encode(), check=True)
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'apply', '-'], input=patch.encode(), check=True)
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '96ac9dec7ccaaf5e0f47119a55f3cb65cacae5e1e65670499c387fdb079e8c4f'
          PY
      - name: Install build tools
        run: python -m pip install 'numpy==2.5.4' packaging setuptools 'wheel==0.48.0' 'cmake>=3.28' ninja
      - name: Prepare compiler cache
        id: compiler
        run: |
          brew list ccache >/dev/null 2>&1 || brew install ccache
          python - <<'PY'
          import hashlib, os, subprocess
          version = subprocess.check_output(['clang', '--version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256=' + hashlib.sha256(version).hexdigest() + '\n')
          PY
      - name: Reuse public upstream compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ort-ccache
          key: ort-402979a-cp312-macos15-arm64-${{ steps.compiler.outputs.sha256 }}-v1
      - name: Build ARM64 NCHWc verification candidate
        env:
          CCACHE_DIR: ${{ runner.temp }}/ort-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}/onnxruntime
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
        working-directory: onnxruntime
        run: >-
          ./build.sh --config Release --build_wheel --parallel 2 --skip_tests
          --compile_no_warning_as_error --cmake_extra_defines
          CMAKE_OSX_ARCHITECTURES=arm64 CMAKE_OSX_DEPLOYMENT_TARGET=14.0
          onnxruntime_USE_ARM_NEON_NCHWC=ON
          CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
          CMAKE_CXX_FLAGS="${{ (inputs.arm_layernorm || inputs.arm_layernorm16) && '-DMLAS_ARM_NEON_REDUCTION8=1 -DMLAS_ARM_AVX2_LAYERNORM=1' || inputs.arm_reduction8 && '-DMLAS_ARM_NEON_REDUCTION8=1' || '' }}"
      - name: Verify architecture and apply ARM64-only wheel tag
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$GITHUB_WORKSPACE/onnxruntime/build" -path '*/dist/onnxruntime-1.31.0-*.whl' -print)
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l | tr -d ' ')" = 1
          python -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); n=[x for x in z.namelist() if x.endswith(".so") and "onnxruntime_pybind11_state" in x]; assert len(n)==1; open(sys.argv[2],"wb").write(z.read(n[0]))' "$wheel" "$RUNNER_TEMP/onnxruntime-state.so"
          lipo "$RUNNER_TEMP/onnxruntime-state.so" -verify_arch arm64
          wheel_dir=$(dirname "$wheel")
          wheel_name=$(basename "$wheel")
          case "$wheel_name" in
            *macosx_14_0_arm64.whl) tagged="$wheel_name" ;;
            *)
              (cd "$wheel_dir" && python -m wheel tags --platform-tag=macosx_14_0_arm64 "$wheel_name" > "$RUNNER_TEMP/tagged-name.txt")
              tagged=$(tail -n 1 "$RUNNER_TEMP/tagged-name.txt")
              ;;
          esac
          case "$tagged" in *macosx_14_0_arm64.whl) ;; *) exit 1 ;; esac
          mkdir output
          cp "$wheel_dir/$tagged" output/
          shasum -a 256 output/*.whl > output/SHA256SUMS.txt
          git -C onnxruntime rev-parse HEAD > output/UPSTREAM-COMMIT.txt
          printf '%s\n' 'onnxruntime_USE_ARM_NEON_NCHWC=ON' 'MLAS_ARM_NEON_REDUCTION8=${{ inputs.arm_reduction8 || inputs.arm_layernorm || inputs.arm_layernorm16 }}' 'MLAS_ARM_AVX2_LAYERNORM=${{ inputs.arm_layernorm || inputs.arm_layernorm16 }}' 'FP16_NORMALIZATION_PATCH=${{ inputs.arm_layernorm16 }}' > output/BUILD-OPTIONS.txt
          git -C onnxruntime diff -- onnxruntime/core/mlas/lib/sconv_nchwc_kernel_neon.cpp > output/UPSTREAM-REDUCTION8.patch
          git -C onnxruntime diff -- onnxruntime/core/mlas/lib/layernorm.cpp > output/UPSTREAM-LAYERNORM.patch
      - name: Save ARM64 verification wheel for one day
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.arm_layernorm16 && 'upstream-onnxruntime-1.31.0-macos-arm64-layernorm16' || inputs.arm_layernorm && 'upstream-onnxruntime-1.31.0-macos-arm64-layernorm' || inputs.arm_reduction8 && 'upstream-onnxruntime-1.31.0-macos-arm64-reduction8' || 'upstream-onnxruntime-1.31.0-macos-arm64-nchwc' }}
          path: output/
          retention-days: 1
          if-no-files-found: error
      - name: Check ARM64 import
        run: |
          python -m pip install output/*.whl
          python -c 'import onnxruntime,platform; assert platform.machine()=="arm64"; assert onnxruntime.__version__=="1.31.0"; assert "CPUExecutionProvider" in onnxruntime.get_available_providers(); print("ARM64 NCHWc ONNX Runtime import passed; numerical compatibility is not yet verified")'
